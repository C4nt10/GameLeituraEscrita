# T045 — a última voz escolhida aparece pré-selecionada ao reabrir a
# configuração (US3 cenário 5). Implementado: `escolha-de-voz` salva em
# `configuracao.vozId` (T046) a cada toque, e lê de lá ao carregar.
#
# NÃO EXECUTADO — mesma ressalva de sempre.

appId: com.anonymous.app
---
- launchApp
- tapOn: '🔊 escolher e testar a voz'
# toca numa voz qualquer (assume que existe pelo menos 1 voz pt no device)
- tapOn:
    text: '^usar voz .*$'
    index: 0
- back
- tapOn: '🔊 escolher e testar a voz'
# a mesma voz deve continuar marcada como selecionada (borda ativa)
- assertVisible:
    text: '^usar voz .*$'
    index: 0
