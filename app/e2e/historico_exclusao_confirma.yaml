# T052 — apagar o histórico exige confirmação antes de executar (US4
# cenário 3, CU-06). Implementado via `Alert.alert` nativo em
# `TelaHistorico.confirmarExclusao` — "Apagar"/"Cancelar", só chama
# `onApagarTudo` se "Apagar" for tocado.
#
# NÃO EXECUTADO — mesma ressalva de sempre. Pressupõe pelo menos 1
# rodada já jogada (senão cai no estado vazio de historico_vazio.yaml,
# que nem mostra o botão de apagar).

appId: com.devirlabs.gameleituraescrita
---
- launchApp
- tapOn: '📜 ver histórico'
- tapOn: '🗑️ apagar histórico'
- assertVisible: 'Apagar histórico?'
- assertVisible: 'Cancelar'
# cancelar não apaga nada
- tapOn: 'Cancelar'
- assertNotVisible: 'Ainda não há nenhuma rodada registrada'
