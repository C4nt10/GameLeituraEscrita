- tapOn: 'Novo perfil'
- tapOn: 'Nome'
- inputText: 'Lua'
- hideKeyboard
- tapOn: 'Salvar'
- tapOn: 'perfil Jogador'
- tapOn: 'Continuar'
- assertVisible: 'Agora é a vez de Jogador 1!'
- tapOn: 'Vamos lá!'
# ... [completar a rodada — a ordem das letras é aleatória, não dá pra scriptar sem seedar o RNG] ...
- tapOn: 'Vamos lá!'
# ... [completar a rodada — a ordem das letras é aleatória, não dá pra scriptar sem seedar o RNG] ...
- assertVisible: 'bora tentar de novo'
- assertNotVisible: 'perdeu'
