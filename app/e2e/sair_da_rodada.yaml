# T021 — D-39 (revoga D-10, doc/definições002.MD §14): botão "sair da
# rodada" sempre visível, em qualquer modalidade — a criança/adulto
# decide quando sair, o app nunca troca de modalidade sozinho.
#
# NÃO EXECUTADO — sem Android SDK/emulador nem Maestro CLI nesta máquina
# (mesma ressalva de sempre, research.md §T002 "1b").
#
# Cobre só a presença/toque do botão nas 3 telas isoladas de dev — a
# persistência de verdade da rodada como "não concluída" ao sair já está
# ligada (T033b, `RodadaLeitura`/`RodadaMatematica` chamam
# `historico.registrarRodada`), mas essas rotas `/_dev/*` não passam por
# um orquestrador (são as telas isoladas, sem `perfilId` de um fluxo
# real) — o comportamento de persistência de verdade fica coberto pelos
# specs de `rodada_completa.yaml`/`rodada_matematica_completa.yaml`.

appId: com.devirlabs.gameleituraescrita
---
- launchApp
- tapOn: 'Ditado (nível 2+)'
- assertVisible: '✕ sair'
- tapOn: '✕ sair'
- tapOn: 'Leitura · montar'
- assertVisible: '✕ sair'
- tapOn: '✕ sair'
- tapOn: 'Leitura · voz'
- assertVisible: '✕ sair'
