# D-39 / FR-018 — se a criança 1 sai no meio, a dupla termina incompleta e nenhum resultado combinado
# aparece (comparar rodada incompleta com completa não seria honesto).
#
# NÃO EXECUTADO — sem Maestro CLI nesta máquina (Android SDK/emulador sim, mas o
# Maestro nunca foi instalado). Escrito contra o app do padrão visual Letra Viva
# (T119): os textos foram conferidos contra o código atual; seletores e fluxos
# nunca rodaram (ex.: se `longPressOn` casa com o rótulo de acessibilidade da
# engrenagem, se `tapOn: 'Nome'` acha o campo). Rotas `_dev` abrem por link
# direto (`gameleituraescrita://`).

appId: com.devirlabs.gameleituraescrita
---
- launchApp:
    clearState: true
- tapOn: 'Tocar para começar'
- longPressOn: 'Opções do adulto. Segure para abrir.'
- tapOn: 'Em dupla'
- tapOn: 'Juntos'
- tapOn: 'Pronto'
- tapOn: 'Jogar!'
- tapOn: 'Novo perfil'
- tapOn: 'Nome'
- inputText: 'Lua'
- hideKeyboard
- tapOn: 'Salvar'
- tapOn: 'perfil Jogador'
- tapOn: 'Continuar'
- assertVisible: 'Agora é a vez de Jogador 1!'
- tapOn: 'Vamos lá!'
- tapOn: 'Sair'
- assertNotVisible: 'tirou mais hoje'
- assertNotVisible: 'Juntos vocês foram muito bem'
