# T047 — o app abre pronto pra jogar, sem configurar nada (Princípio VII).
# Depois da abertura, o início já vem com um jeito de jogar escolhido e "Jogar!" ligado.
#
# NÃO EXECUTADO — sem Maestro CLI nesta máquina (Android SDK/emulador sim, mas o
# Maestro nunca foi instalado). Escrito contra o app do padrão visual Letra Viva
# (T119): os textos foram conferidos contra o código atual; seletores e fluxos
# nunca rodaram (ex.: se `longPressOn` casa com o rótulo de acessibilidade da
# engrenagem, se `tapOn: 'Nome'` acha o campo). Rotas `_dev` abrem por link
# direto (`gameleituraescrita://`).

appId: com.devirlabs.gameleituraescrita
---
- launchApp:
    clearState: true
- tapOn: 'Tocar para começar'
- assertVisible: 'Oi! Do que vamos brincar?'
- assertVisible: 'Jogar!'
- tapOn: 'Jogar!'
- assertVisible: 'Sair'
- assertVisible: 'espiou' # padrão é Ler e montar
