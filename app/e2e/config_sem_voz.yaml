# T044 — sem nenhuma voz pt instalada, o app informa e orienta a
# instalação, sem falhar silenciosamente (US3 cenário 4, CU-07).
# Implementado em `TelaEscolhaDeVoz`: quando `motivoSemVoz` não é nulo
# (vindo de `capacidade_aparelho.vozPortugues`, T017), mostra a
# orientação de instalar, em vez da lista vazia sem explicação
# (Princípio III).
#
# NÃO EXECUTADO — mesma ressalva de sempre, mais a limitação de precisar
# de um aparelho/emulador sem nenhuma voz pt instalada de propósito.

appId: com.devirlabs.gameleituraescrita
---
- launchApp
- tapOn: '🔊 escolher e testar a voz'
- assertVisible: 'Nenhuma voz em português encontrada'
- assertVisible: 'Instale uma voz em português'
